<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>影院卡片墙</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0e0e11;
    min-height: 100vh;
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Helvetica Neue", sans-serif;
    color: #fff;
    overflow-x: hidden;
  }

  .header {
    text-align: center;
    padding: 40px 20px 20px;
  }
  .header h1 {
    font-size: 32px;
    font-weight: 700;
    letter-spacing: 6px;
    color: #fff;
    margin-bottom: 8px;
  }
  .header .subtitle {
    font-size: 13px;
    color: #666;
    letter-spacing: 3px;
  }

  .filter-bar {
    display: flex;
    justify-content: center;
    gap: 10px;
    padding: 15px 20px 5px;
    flex-wrap: wrap;
  }
  .filter-btn {
    padding: 7px 18px;
    border: 1px solid #333;
    background: #1a1a1f;
    color: #888;
    border-radius: 20px;
    cursor: pointer;
    font-size: 12px;
    transition: all 0.25s ease;
    letter-spacing: 1px;
  }
  .filter-btn:hover { border-color: #555; color: #ccc; }
  .filter-btn.active { background: #fff; color: #0e0e11; border-color: #fff; font-weight: 600; }

  .sub-filter-bar {
    display: flex;
    justify-content: center;
    gap: 8px;
    padding: 8px 20px 15px;
    flex-wrap: wrap;
    min-height: 36px;
  }
  .sub-filter-bar.hidden { display: none; }
  .sub-btn {
    padding: 5px 14px;
    border: 1px solid #2a2a30;
    background: #15151a;
    color: #666;
    border-radius: 14px;
    cursor: pointer;
    font-size: 11px;
    transition: all 0.2s ease;
  }
  .sub-btn:hover { border-color: #444; color: #aaa; }
  .sub-btn.active { background: #2a2a35; color: #ddd; border-color: #444; }

  .count-label {
    text-align: center;
    color: #444;
    font-size: 12px;
    padding-bottom: 15px;
    letter-spacing: 1px;
  }

  .card-wall {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 18px;
    padding: 10px 30px 60px;
    max-width: 1600px;
    margin: 0 auto;
  }

  .card-wrap {
    perspective: 1200px;
    cursor: grab;
    position: relative;
    min-height: 320px;
  }
  .card-wrap.wide {
    grid-column: span 2;
  }
  .card-wrap:active { cursor: grabbing; }
  .card-wrap.dragging {
    z-index: 9999;
    opacity: 0.9;
    transform: scale(1.03);
  }
  .card-wrap.hidden { display: none; }

  .card {
    width: 100%;
    height: 100%;
    min-height: 320px;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.55s cubic-bezier(0.4, 0, 0.2, 1);
    border-radius: 14px;
  }
  .card.flipped { transform: rotateY(180deg); }

  .card-face {
    position: absolute;
    width: 100%;
    height: 100%;
    min-height: 320px;
    backface-visibility: hidden;
    border-radius: 14px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    padding: 22px;
    border: 1px solid;
  }

  .card-front {
    background: linear-gradient(160deg, #1c1c22, #16161a);
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .card-back {
    background: linear-gradient(160deg, #1a1a20, #131318);
    transform: rotateY(180deg);
    overflow-y: auto;
  }

  .card-section-tag {
    position: absolute;
    top: 12px;
    left: 14px;
    font-size: 10px;
    color: #555;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .card-flip-hint {
    position: absolute;
    top: 12px;
    right: 14px;
    font-size: 10px;
    color: #444;
  }

  .card-title {
    font-size: 20px;
    font-weight: 700;
    line-height: 1.4;
    color: #fff;
    margin-bottom: 14px;
    text-align: center;
  }
  .card-era {
    font-size: 13px;
    color: #999;
    margin-bottom: 16px;
    font-weight: 400;
  }
  .card-source-front {
    font-size: 11px;
    color: #555;
    margin-bottom: 14px;
    line-height: 1.5;
    max-width: 90%;
  }
  .card-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    justify-content: center;
  }
  .tag {
    font-size: 10px;
    padding: 3px 10px;
    border-radius: 10px;
    background: rgba(255,255,255,0.06);
    color: #777;
    border: 1px solid rgba(255,255,255,0.08);
  }

  .card-back .back-title {
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    margin-bottom: 10px;
    padding-bottom: 8px;
    border-bottom: 1px solid #2a2a30;
  }
  .card-back .back-content {
    font-size: 12.5px;
    line-height: 1.85;
    color: #bbb;
    flex: 1;
  }
  .card-back .back-source {
    font-size: 11px;
    color: #555;
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid #2a2a30;
    line-height: 1.5;
  }

  .card-back::-webkit-scrollbar { width: 3px; }
  .card-back::-webkit-scrollbar-track { background: transparent; }
  .card-back::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

  /* Section color accents */
  .sec-form .card-face { border-color: #2d3a50; }
  .sec-social .card-face { border-color: #4d3a30; }
  .sec-lit .card-face { border-color: #3a304d; }

  .sec-form .card-section-tag { color: #4a5a7a; }
  .sec-social .card-section-tag { color: #7a5a4a; }
  .sec-lit .card-section-tag { color: #6a5a8a; }

  @media (max-width: 700px) {
    .card-wrap.wide { grid-column: span 1; }
    .card-wall { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; padding: 10px 15px 40px; }
    .card-title { font-size: 15px; }
    .card { min-height: 260px; }
    .card-face { min-height: 260px; padding: 14px; }
    .header h1 { font-size: 22px; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>影 院 卡 片 墙</h1>
  <div class="subtitle">形式灵感 · 社会素材 · 文学摘录</div>
</div>

<div class="filter-bar">
  <button class="filter-btn active" data-filter="all">全部</button>
  <button class="filter-btn" data-filter="形式灵感">形式灵感 <span style="opacity:.5">47</span></button>
  <button class="filter-btn" data-filter="社会素材">社会素材 <span style="opacity:.5">24</span></button>
  <button class="filter-btn" data-filter="文学">文学摘录 <span style="opacity:.5">50</span></button>
</div>

<div class="sub-filter-bar hidden" id="subFilterBar"></div>

<div class="count-label" id="countLabel">共 121 张卡片 · 点击翻转 · 拖拽移动</div>

<div class="card-wall" id="cardWall"></div>

<script>
const rawData = [{"section": "形式灵感", "category": "一、空间形态类型", "title": "电影宫殿（Movie Palace）", "content": "1910年代—1930年代美国出现的超大规模影院建筑类型，以折中主义古典或新古典形式为主，空间上从强调外部入口、票房逐渐转向强调门厅、大厅等内部公共空间。Rapp and Rapp建筑事务所为Balaban & Katz设计了数百座电影宫，风格涵盖装饰艺术、巴洛克、埃及式、哥特式、摩尔式等多种类型，门厅与观众厅同等宏大。", "source": "兰俊《美国影院发展史研究》，清华大学博士论文，2012年", "era": "1913—1932年", "tags": ["电影宫殿", "折中主义", "仪式空间", "古典形式"]}, {"section": "形式灵感", "category": "一、空间形态类型", "title": "大气影院（Atmospheric Theatre）", "content": "1920年代电影宫殿的变体，用投影机在天花板上投射飘动的云彩和蔚蓝天空，取代传统华丽穹顶和水晶吊灯。观众进入影厅如同进入户外庭院，银幕成为虚构天空下的焦点。代表案例包括芝加哥的Paradise Theatre等。", "source": "DBpedia “Atmospheric theatre”条目；Encyclopedia of Chicago “Movie Palaces”", "era": "1920年代", "tags": ["虚假天空", "建筑幻觉", "沉浸空间", "环境叙事"]}, {"section": "形式灵感", "category": "一、空间形态类型", "title": "轻歌舞剧院（Vaudeville Theatre）", "content": "电影放映早期寄居于轻歌舞剧院的建筑类型。影院空间与舞台表演空间共用，电影只是穿插在杂耍、歌舞节目之间的一个段落。这一空间逻辑至今仍在部分混合业态影院中回响。", "source": "《美国影院发展史研究》目录，第3章“轻歌舞剧院”", "era": "1890年代—1920年代", "tags": ["混合演艺", "寄居空间", "节目单逻辑"]}, {"section": "形式灵感", "category": "一、空间形态类型", "title": "门脸影院（Storefront Theatre）", "content": "利用沿街商铺门面改建的小型放映空间，常见于1900年代美国城市街区。空间狭长，银幕设在店铺尽头，入口直接面向人行道。这种“以商业门脸伪装影院功能”的空间策略，与今天商场内嵌入式影院的空间逻辑形成历史呼应。", "source": "《美国影院发展史研究》目录，第3章“门脸影院”", "era": "1900—1910年代", "tags": ["沿街空间", "商业伪装", "微型影院"]}, {"section": "形式灵感", "category": "一、空间形态类型", "title": "露天影院 / 汽车影院", "content": "汽车影院观众坐在各自汽车内通过调频收听和观看露天电影。北京枫花园汽车电影院拥有4个放映场地（含3D）和25米宽的凹型全钢露天巨幕，建成了全球首家3D露天电影院和全球首家巨幕露天影院。郑州首家汽车影院总占地40000平方米，两块巨幕可容纳80辆车同时观影，屏幕高17米。松江汽车影院的两块全金属银幕高10米、宽20米，“在巨幕前，爱车就像是可移动且独立的包间”。", "source": "百度百科“枫花园汽车电影院”；大河网（2024、2026）；澎湃新闻（2023）", "era": "1933年至今（美国首座1933年，中国案例集中于2010年代—2026年）", "tags": ["汽车影院", "露天放映", "移动包间", "巨幕奇观"]}, {"section": "形式灵感", "category": "一、空间形态类型", "title": "海岛露天影院", "content": "2023年，山东田横岛建成山东首家海岛露天电影院，拥有450吋超级银幕、FM发射器，可实现汽车影院效果，枕着波涛吹着海风看电影。这一形态将“影院”嵌入自然地理空间，银幕成为海天之间的界面。", "source": "半岛网，2023年", "era": "2023年", "tags": ["自然剧场", "海岛空间", "地理嵌入"]}, {"section": "形式灵感", "category": "一、空间形态类型", "title": "微型影院（Microcinema）", "content": "近年来欧洲出现的影院新空间趋势：影院厅趋向小型化，聚焦私密性与少数观众之间的共同体感，追求一种近乎家居感的温暖体验。这种被称为“microcinema”的空间是一种流动的、嵌入更广泛功能之中的空间，观看银幕上的投影成为智性思辨的契机，不再仅仅与个人专注有关，而是通向公共对话。", "source": "Diego Terna & Luca Maria Francesco Fabris, The Plan Journal, 2026年", "era": "2020年代", "tags": ["微型影院", "家居感", "公共对话", "欧洲趋势"]}, {"section": "形式灵感", "category": "一、空间形态类型", "title": "独立式影院 / 综合体影院 / 依附式影院", "content": "一项以北京108家影院为对象的研究，将当代影院建筑空间归纳为三种模式：独立式（独立建筑体）、综合体（嵌入购物中心等）、依附式（依附于其他建筑功能）。这三种模式对应了影院与城市关系的三种不同姿态。", "source": "《当代北京影院建筑空间模式初探》", "era": "研究覆盖当代（约2010年代至今）", "tags": ["空间模式", "城市关系", "嵌入与独立"]}, {"section": "形式灵感", "category": "一、空间形态类型", "title": "中国电影院空间的“四阶段”演变", "content": "中国电影院空间经历了四个阶段：早期茶楼戏园的“寄居者”→ 独立单体影院 → 会堂式影院 → 现代多厅影城。这一演变不仅是建筑形态的变化，更折射了电影在中国从“外来物”到“城市公共文化主体”的身份转变。", "source": "《艺术探索》2025年第01期，“由他者到主体：中国电影院空间的现代化演变”", "era": "1900年代至今（研究发表于2025年）", "tags": ["空间现代化", "寄居者", "身份转变"]}, {"section": "形式灵感", "category": "二、建筑风格与美学", "title": "新艺术运动风格影厅", "content": "Module K设计的Beta电影院通过柔和的粉彩色调让人联想到新艺术运动（Art Nouveau）的美学语言。影院设计可以成为一种风格史的当代引用，而非简单的“现代简约”通用模板。", "source": "ArchDaily “当代影院建筑中的物质文化与遗产”，2026年", "era": "2020年代设计，援引1900年前后风格", "tags": ["新艺术运动", "色彩空间", "风格引用"]}, {"section": "形式灵感", "category": "二、建筑风格与美学", "title": "工业复古风影院", "content": "影院装修风格中明确可辨的一类，通常搭配柔和灯光、色彩，体现工厂元素如水泥墙、各种铁件等。南京银兴乐天国际影城（门东店）以“声音”为出发点，用红色管道塑造声音的弯曲形态，贯穿整个影院空间——声波本身是极抽象的形态，既弯曲又高高低低，设计师利用红色管道来塑造这些自由的弯曲形态。", "source": "站酷“电影院装修风格”，2023年；gooood.cn “红色声波——南京银兴乐天国际影城”，2016年", "era": "2016年（设计案例）", "tags": ["工业复古", "红色管道", "声波空间化", "抽象形态"]}, {"section": "形式灵感", "category": "二、建筑风格与美学", "title": "影院大堂的“扩音器”造型", "content": "长沙银兴万影汇国际影城的设计中，设计师希望观者注意到空间中的设计形式，减少多余装饰，以一种简单的方法来表现“扩音器”的弧形——将喇叭口造型从地面延伸到天花，延伸空间中的透视关系。", "source": "ArchDaily “长沙银兴万影汇国际影城 / 壹正企划”，2019年", "era": "2019年", "tags": ["扩音器形态", "透视延伸", "极简叙事"]}, {"section": "形式灵感", "category": "二、建筑风格与美学", "title": "主题沉浸式与自然生态风格", "content": "影院装修的风格分类中，主题沉浸式通过环境叙事让观众进入特定情境，自然生态风格则将植物、木质、水景等元素引入观影空间。这些风格类型与“大气影院”的历史逻辑一脉相承——都在构建银幕之外的第二空间。", "source": "装馨家“电影院装修风格”，2025年", "era": "2025年", "tags": ["主题沉浸", "自然生态", "第二空间"]}, {"section": "形式灵感", "category": "二、建筑风格与美学", "title": "影院中的“索道入戏口”", "content": "重庆万达影城大融城店设计了“索道入戏口”，仿照重庆长江索道造型，营造穿越江面般的视觉体验；影城内“雾都光影线”以轻轨车厢为灵感，两侧LED屏还原沿线城市风景。这是影院空间“在地化”的形式策略：用本地城市符号构建进入影厅的过渡仪式。", "source": "人民网重庆频道，2025年", "era": "2025年", "tags": ["在地化设计", "城市符号", "过渡仪式"]}, {"section": "形式灵感", "category": "二、建筑风格与美学", "title": "LED冰屏与青瓷屋顶：老影院的“双面”立面", "content": "台州黄岩影城改造中，外立面采用LED冰屏技术实现“一墙双用”——白天展现老城韵味，夜晚化身光影画布；屋顶以沙埠青瓷文化元素为灵感，以青瓷碗状发光体为设计载体。影院的建筑表皮成为一种时间性的媒介。", "source": "浙江在线台州频道、台州日报，2025年", "era": "2025年", "tags": ["LED冰屏", "时间性立面", "青瓷文化"]}, {"section": "形式灵感", "category": "二、建筑风格与美学", "title": "平遥电影宫：工业遗产的戏剧化改造", "content": "由清华大学建筑设计研究院廉毅锐团队设计，以平遥国际电影展为契机，选择平遥古城内的废弃工业用地——平遥柴油机厂改造而成。增建的500人影厅延续厂区坡屋顶形式，材料以青砖砌筑为主，局部利用红砖镂空。设计师在厂区中植入一个古典传统亭子，称之为“工业艺术区内的一个戏剧化桥段”“一个虚构的电影场景”“一个反复的蒙太奇”。露天影院“站台”旁的几棵大树被专门保留，为此不惜将入口处平台设计成不对称的。", "source": "中国电影报（2019）；澎湃新闻（2021）；百度百科“平遥电影宫”（2026）", "era": "2017—2018年建成，后续持续获奖", "tags": ["工业遗产", "戏剧化桥段", "树木保留", "坡屋顶"]}, {"section": "形式灵感", "category": "三、空间改造与适应性再利用", "title": "Yorck Kino Passage电影院：新古典主义建筑的电影重生", "content": "柏林Yorck Kino Passage电影院所在建筑最初是建于1908年的Rixdorfer Gesellschaftshaus，两年后Excelsior Lichtspielhaus电影院在此开业。影院关闭后曾用作家具仓库，1980年代末Yorck影院集团接管并将宏伟的主放映厅恢复了往昔历史辉煌。原吧台的部分耐候钢包层被重新利用安装为面板、装饰条和固定元件，黄铜灯具和历史石膏饰线在新概念下得以修复。", "source": "ArchDaily “当代影院建筑中的物质文化与遗产”，2026年", "era": "1908年始建，1980年代末改造，持续更新", "tags": ["新古典主义", "物质循环", "耐候钢再利用"]}, {"section": "形式灵感", "category": "三、空间改造与适应性再利用", "title": "渔光影院：码头通道的影院化", "content": "“渔光影院 Fishermen Light Cinema”位于宁波象山县石浦镇渔港南路的东门码头，将原有的码头通道建筑改造为游客驿站，提供候船休息空间及零售空间，并保留码头通道功能。获2025 MUSE Design Awards建筑类适应性改造金奖。", "source": "theyarchitects.com，2025年", "era": "2025年", "tags": ["码头改造", "驿站影院", "通道保留"]}, {"section": "形式灵感", "category": "三、空间改造与适应性再利用", "title": "M511光影汇：旧仓库的多业态集聚", "content": "浙江杭州一处旧仓库经过五年改建，被打造为观影、戏剧、展览、演艺等文化业态的集聚地——M511光影汇。观众来到这里不只能看到院线电影，还能参加露天音乐会、数字文博展、文化夜集市等。每个影厅都有着多业态的设计。", "source": "央视网，2025年", "era": "2020—2025年改建", "tags": ["旧仓库改造", "多业态", "文化消费地标"]}, {"section": "形式灵感", "category": "三、空间改造与适应性再利用", "title": "老电影院改造的“内部—外部”双层价值转化", "content": "从其他城市案例看，围绕老电影院本身鲜明的建筑类型特征，存在由内部建筑空间到外部城市空间的两个层次的价值转化路径。盐城电影院老建筑改造后，中部通高空间用于放置剧场模块，两侧二层长廊底层用于图书和文创产品销售，上层用于长期布展。", "source": "腾讯新闻“电影院老建筑何以翻新”，2026年", "era": "2026年", "tags": ["双层转化", "通高空间", "长廊布展"]}, {"section": "形式灵感", "category": "三、空间改造与适应性再利用", "title": "尉犁老电影院：“留住老味道、添上新功能”", "content": "新疆尉犁老电影院改造中，秉持“留住老味道、添上新功能”理念，以高延性混凝土技术加固主体，墙面门窗按原貌翻新，最大程度保留历史风貌，内部观影区配齐现代化设备。", "source": "央广网新疆频道，2025年", "era": "2025年", "tags": ["原貌保留", "技术加固", "新旧共存"]}, {"section": "形式灵感", "category": "四、观影行为与空间实践", "title": "镍币影院的“5美分空间民主”", "content": "1905年匹兹堡镍币影院开业首日有450人排队，第二天增至1500人。廉价镍币影院将电影推广到工人、移民等工薪阶层。一个世纪后，这些建筑不再是社区的威胁，而成为社区的构成部分。空间形式本身即携带社会民主的基因。", "source": "Prospect Magazine, “Widescreen”, 2005年", "era": "1905—1910年代", "tags": ["空间民主", "工人阶层", "平民娱乐"]}, {"section": "形式灵感", "category": "四、观影行为与空间实践", "title": "沪北电影院的“易拉宝坦白局”", "content": "2026年上海国际电影节期间，40年历史的沪北电影院用AI“手搓”易拉宝，把往年的“小缺点”和最新的改进对策一条条列在展板上。这些海报甚至保留了几个错别字（“戴领带”写成“带领带”）。检票口工作人员轻声提醒“手机调一下静音”；开场前20分钟循环播放文明观影宣传片；工作人员举着近一米见方的LED灯牌沿过道缓缓巡场两次，灯牌形似海底捞的生日牌，写着“请保持安静”“不要随意走动”。", "source": "青年报·青春上海，2026年", "era": "2026年", "tags": ["影院服务设计", "代际摩擦", "LED灯牌巡场", "易拉宝"]}, {"section": "形式灵感", "category": "四、观影行为与空间实践", "title": "影院作为“休闲与仪式”的双重空间", "content": "研究指出，休闲表征体现为人们与“日常性”的分离以及对阶层隔阂的突破；仪式表征体现为个人观影中的代入感与精神互动，以及集体观影中熟人与陌生人共同构建的社会联系。影院空间同时承载“逃离日常”与“重建联结”两种功能。", "source": "张浩、林家惠、蔡晓梅，“休闲与仪式：电影院的空间生产研究”，《旅游导刊》2021年第5卷第2期", "era": "研究发表于2021年", "tags": ["休闲空间", "仪式空间", "社会联结"]}, {"section": "形式灵感", "category": "四、观影行为与空间实践", "title": "“瓦子角17号”：民间放映组织的空间实践", "content": "南昌民间放映组织“瓦子角17号”为愿意为电影驻留的观众创造彼此相遇的空间。资深影迷形容：“‘瓦子角17号’打造的是一种理想的观影环境，电影在这里被认真对待，不只是被播放，而是被理解、被讨论、被回应。”", "source": "江西日报、人民网江西频道，2026年", "era": "2020年代", "tags": ["民间放映", "讨论空间", "影迷社群"]}, {"section": "形式灵感", "category": "四、观影行为与空间实践", "title": "一日连看三场：影迷的空间谋划", "content": "一位影迷的自述：“有那么三四天，我创造了一天连看三场的纪录，精心算计好片连场的可能性，睿智地谋划好影院与影院的最佳距离。”观影行为本身成为一种城市空间实践——在影院之间穿行、计算时间、规划路线。", "source": "解放日报“十日谈·光影背后的故事”，2026年", "era": "2026年", "tags": ["城市漫游", "观影路线", "时间规划"]}, {"section": "形式灵感", "category": "四、观影行为与空间实践", "title": "博物馆里的“黑盒子”：观影惯性的空间还原", "content": "台北美术馆2024年秋天在地下楼打造艺术影院，“从零开始打造出复古售票处、电影时刻表、影厅隔音用的长廊”，将美术馆的白盒子空间通过设计转变为电影院“黑盒子”的过渡动线，使观众能从头思考长期被建构出的观影惯性，还原观影时身体动线，乃至引发观众在电影播映之前的期待与进场仪式感。", "source": "酿电影专访“从白盒子走向黑盒子的实验性探索”，2025年", "era": "2024—2025年", "tags": ["白盒子到黑盒子", "观影惯性", "身体动线", "仪式还原"]}, {"section": "形式灵感", "category": "四、观影行为与空间实践", "title": "Invisible Cinema：全黑空间的个体观影实验", "content": "1970年，奥地利电影人、建筑师、音乐家Peter Kubelka设计了一座实验性影厅“Invisible Cinema”——一个约90座的全黑观众厅，观众在其中以个体化方式观看投影。这是对影院“集体空间中的个体经验”的极端形式实验。", "source": "Wikipedia（西班牙语）“Invisible Cinema”条目", "era": "1970年", "tags": ["全黑空间", "个体观影", "实验建筑"]}, {"section": "形式灵感", "category": "五、放映技术与影像形式", "title": "新艺拉玛（Cinerama）：三机同步的弧形巨幕", "content": "1952年，第一部全景电影《这就是新艺拉玛》（This Is Cinerama）在纽约百老汇首映，使用三台电影摄影机拍摄，又运用三台放映机投映在弯曲成146°角的屏幕上形成影像。这是影院空间被影像技术重新定义的开端——银幕不再是一面墙，而是一个包裹观众的弧面。", "source": "网易“LED屏能把观众拉回电影院吗？”，2025年", "era": "1952年", "tags": ["三机同步", "弧形银幕", "包裹空间", "全景电影"]}, {"section": "形式灵感", "category": "五、放映技术与影像形式", "title": "有声电影与“维他风”系统", "content": "1926年8月6日，世界第一部有声短片《唐璜》使用“维他风”（Vitaphone）系统放映，通过唱片与胶片同步播放实现声音传递。声音的出现不仅颠覆电影美学，更改变了影院的音响系统配置和空间声学要求。", "source": "新民晚报“技术革命推动电影形态变革”；山东大学博士论文", "era": "1926—1927年", "tags": ["有声电影", "维他风", "声音空间", "声学转型"]}, {"section": "形式灵感", "category": "五、放映技术与影像形式", "title": "从胶片到数字：放映设备的空间痕迹", "content": "2008年前后，中国影院开始从胶片放映机更换为数字放映系统。数字技术大大压缩了电影制作和放映成本，使大片放映不再局限于大城市。放映设备的更替同时改变了放映间的空间需求——从需要专门隔音和通风的胶片机房，变为更紧凑的数字服务器空间。", "source": "人民网“从坐小板凳看到数字化体验”，2018年；形势政策网，2025年", "era": "2002—2008年（过渡期）", "tags": ["胶片到数字", "放映间空间", "成本压缩"]}, {"section": "形式灵感", "category": "五、放映技术与影像形式", "title": "IMAX：从70mm胶片到数字系统", "content": "1970年，第一部IMAX“电影”——17分钟短片《虎之子》在日本诞生。2008年起，胶片IMAX被数字IMAX放映系统取代，免除了70mm笨重底片的物理限制。IMAX的杀招是超大银幕和独有的摄制标准，建立了从前期摄制到放映环境的一整套流程标准。CINITY是目前唯一支持“4K+120帧+3D”的放映格式。", "source": "界面新闻“巨幕之战：数字影厅不完全进化史”，2021年；澎湃新闻“IMAX、杜比、巨幕、CINITY……电影院到底怎么选”，2023年", "era": "1970—2008年—2020年代", "tags": ["IMAX", "格式政治", "技术标准化", "观众决策"]}, {"section": "形式灵感", "category": "五、放映技术与影像形式", "title": "8.75毫米放映机：农村放映的空间尺度", "content": "中国农村电影放映员王树贤从1969年到2019年当了半个世纪的放映员，见证了中国农村电影放映的变迁——从8.75毫米电影胶片机、16毫米电影胶片机到数码放映机。8.75毫米胶片机极其轻便，放映空间可以是任何一块空地、一面墙、一棵树之间。这是影院空间形式的最极简版本。", "source": "中国日报，2019年", "era": "1969—2019年", "tags": ["农村放映", "极简放映空间", "流动影院"]}, {"section": "形式灵感", "category": "六、声学空间设计", "title": "上海影城：五种体型，五种声学", "content": "上海影城是国内规模最大的多厅电影院之一，5个电影厅规模分别为1100座、500座、300座、60座及50座。1100座主厅为扇形平面，侧墙展斜角9°，体型呈前窄后宽、前高后低，是70mm电影厅的最佳体型；500厅及300厅均为钟形平面；60和50两个小厅为简单矩形。五个厅地坪均为全台阶起坡式，平均起坡0.2m，均不设楼座，也无台框。", "source": "章奎生，“上海影城的建筑声学设计”，《声学技术》", "era": "1993年发表（影城建成于1991年）", "tags": ["扇形平面", "钟形平面", "体型声学", "台阶起坡"]}, {"section": "形式灵感", "category": "六、声学空间设计", "title": "声波的空间化：红色管道的形态实验", "content": "南京银兴乐天国际影城以声音为出发点，将声波——包括演员对话、后期声效、现场收音以至配乐——转化为空间中的红色管道形态。声波本身是极抽象的形态，既弯曲又高高低低，设计师利用红色管道来塑造这些自由的弯曲形态，贯彻整个影院空间。", "source": "gooood.cn，2016年", "era": "2016年", "tags": ["声波可视化", "红色管道", "抽象形态空间化"]}, {"section": "形式灵感", "category": "六、声学空间设计", "title": "星空顶与弹性减力墙：私人影音空间", "content": "专业影音室设计中，距原墙十公分起一道龙骨墙达到中空隔音效果，在龙骨墙基础上继续做弹性减力结构达到更隔音、低频缓冲的目的。顶面前一部分做聚酯纤维吸音板星空顶，在光纤灯闪烁下搭配流星效果。前墙设计音障墙做法，让音箱隐藏于幕后。", "source": "hdavchina.com “陕西延安圣地河谷金延安景区专业影音室”，2024年", "era": "2024年", "tags": ["弹性减力墙", "星空顶", "音障墙", "隐藏音箱"]}, {"section": "形式灵感", "category": "六、声学空间设计", "title": "硅砂吸声材料在CINITY影院中的应用", "content": "硅砂吸声材料具有高吸声性能、高材料强度、环保性能优异等优势，已用于公共大厅、展览馆等对声学有一定要求的空间，但在音乐厅、剧院、高端影院等高要求场所应用较少。CINITY影院建设案例中开始将其纳入声学设计和模组化方案。", "source": "《广播电视信息》2026年S1期", "era": "2026年", "tags": ["硅砂吸声", "材料创新", "CINITY"]}, {"section": "形式灵感", "category": "七、策展与空间增值实践", "title": "万达影城“BE LOVED & BE RICH”：影院变艺术馆", "content": "2024年12月31日，北京CBD万达影城举办“时光里艺术家共创展”，展出70件作品，展览为期三个月，来访游客均可免费参观。展览中供等待电影开场的参观者休息的椅子被艺术家进行了涂鸦，甚至允许访客在此基础上继续创作，使其最终成为“银幕无边界”的实体象征。", "source": "封面新闻，2025年；China Daily, 2025年", "era": "2024—2025年", "tags": ["影院策展", "椅子共创", "银幕无边界"]}, {"section": "形式灵感", "category": "七、策展与空间增值实践", "title": "艾尚乐汀艺术影城：“美术馆策展”的影院", "content": "青岛银座商城五层的艾尚乐汀艺术影城，没有爆米花机轰鸣，用“美术馆策展”的审美格调与电影会所的定制服务，重塑大众对电影院的想象。以21个激光影厅为载体。", "source": "中国山东网青岛频道，2025年", "era": "2025年", "tags": ["美术馆格调", "无爆米花机", "定制服务"]}, {"section": "形式灵感", "category": "七、策展与空间增值实践", "title": "影院走廊作为开放式展区", "content": "2026年，萍乡传媒影城联合萍乡学院举办青年美术作品展，创新采用全域分层布展模式：影厅走廊打造为开放式大众展区，VIP厅设为精品画作专属展区，“一闹一静”形成观展节奏。观影动线转化为展览动线，候场时间转化为观看时间。", "source": "萍乡日报数字报刊平台，2026年", "era": "2026年", "tags": ["动线转化", "候场策展", "影院+学院"]}, {"section": "形式灵感", "category": "七、策展与空间增值实践", "title": "影院大厅的“非遗市集”", "content": "2026年春节期间，万达影城吉林昌邑店在大厅展示满族旗袍盘扣技艺，潇湘国际影城宁乡店将电影文化与本土非遗、美食融合，打造“可逛、可玩、可品、可感的复合型文化消费空间”。影院的等候区、大厅和走廊正在被重新定义为“第三空间”。", "source": "今日头条、宁乡新闻网、搜狐新闻，2026年", "era": "2026年", "tags": ["第三空间", "非遗市集", "复合消费"]}, {"section": "形式灵感", "category": "七、策展与空间增值实践", "title": "大馆石阶影院：历史古迹的表演空间", "content": "香港大馆将历史古迹化身成为独一无二的表演空间，邀请本地新晋电影人及音乐制作人筹划策展，“大馆石阶影院”利用建筑本身的石阶地形作为观众席，将古迹空间转化为放映与音乐表演的场地。", "source": "大馆官网，2025/26季度", "era": "2025—2026年", "tags": ["古迹影院", "石阶观众席", "地形利用"]}, {"section": "形式灵感", "category": "七、策展与空间增值实践", "title": "北京民俗博物馆的“东岳艺术季”夜间观影", "content": "北京民俗博物馆开启夜间观影活动，跳出传统文博体验模式，以沉浸式复古场景为核心，搭配经典影像展播，在古朴雅致氛围中唤醒大众时代记忆。古建空间成为放映的容器，影像与建筑遗产相互渗透。", "source": "党建网，2026年", "era": "2026年", "tags": ["古建放映", "沉浸式复古", "夜间观影"]}, {"section": "形式灵感", "category": "八、空间理论与分析框架", "title": "列斐伏尔“三元空间”与影院的对应", "content": "空间实践对应影院建筑物的兴建、改造及其与城市经济的联系；空间的再现对应影院设计理念、管理制度与生产关系；再现性空间对应观众个体对影院空间的感知、经验、记忆与想象。这一框架将影院从物理建筑提升为空间生产的具体场域。", "source": "张一玮提出的中国电影院史空间研究框架；张浩等《旅游导刊》2021年", "era": "理论源流1974年（列斐伏尔），应用研究集中于2010年代至今", "tags": ["空间生产", "三元辩证法", "影院分析框架"]}, {"section": "形式灵感", "category": "八、空间理论与分析框架", "title": "影院的“异托邦”属性", "content": "在福柯的意义上，影院可以是一个“异托邦”——一个在真实场所中被有效实现了的乌托邦，它同时是物理空间和社会想象的交汇处。这一理论工具可用于分析影院的“现实—虚构”双重属性：观众坐在真实座位上，面对虚构影像，身处一个既是现实又是非现实的空间。", "source": "《瞬间的异托邦：〈一秒钟〉的“电影院”空间研究》", "era": "研究发表于2020年后", "tags": ["异托邦", "福柯", "现实与虚构"]}, {"section": "形式灵感", "category": "八、空间理论与分析框架", "title": "影院建筑的四种类型学框架", "content": "Chris van Uffelen在 Cinema Architecture 中提出四种影院类型学：固定焦点（fixed focus）、点焦点（spot focus）、多焦点（multi-focus）和顾客焦点（customer focus）。这一分类从观众注意力与空间组织的关系出发，为影院空间设计提供了形式分析的坐标。", "source": "Chris van Uffelen, Cinema Architecture，转引自University of Maryland学术库", "era": "2000年代", "tags": ["类型学", "注意力空间", "焦点模式"]}, {"section": "形式灵感", "category": "八、空间理论与分析框架", "title": "多厅影院的空间理念变革", "content": "多厅影院不仅仅是厅容量的变化，更是影院运营方式与空间构成理念的变革。观众在购票时就需要“选择”看什么，而不再是走进一个统一的大厅后发现银幕。候场走廊成为“选择的空间”，影厅编号成为“内容的标签”。", "source": "万方数据“多厅影院空间架构研究”，2013年", "era": "1963—1988年（美国多厅时期），1990年代起中国引入", "tags": ["选择空间", "多厅逻辑", "运营空间化"]}, {"section": "社会素材", "category": "社会现象", "title": "影院午休“躺平计划”", "content": "影院从观影空间转型为打工人的“服务型社交空间”。", "source": "卢米埃影城西安曲江创意谷店 · 2025年", "era": "", "tags": []}, {"section": "社会素材", "category": "社会现象", "title": "VIP厅午休服务", "content": "影院闲置时段被重新定义为“躺平经济”的物理载体。", "source": "卢米埃北京芳草地店 · 2025年5月", "era": "", "tags": []}, {"section": "社会素材", "category": "社会现象", "title": "男女分厅午休", "content": "影院座椅从“观影工具”变为“睡眠工具”，放倒的是座椅也是观影仪式感。", "source": "济南幸福蓝海影城银座店 · 2026年9月", "era": "", "tags": []}, {"section": "社会素材", "category": "社会现象", "title": "商务VIP厅午休", "content": "影院空间的“消费场景”已从电影本身滑向功能型空间租赁。", "source": "郑州中影尚座国际影城 · 2026年", "era": "", "tags": []}, {"section": "社会素材", "category": "社会现象", "title": "海底捞“9号火锅影厅”", "content": "视觉与味觉同时“占有”银幕，“黑暗+屏幕”组合从观影标配变为社交消费套餐。", "source": "北京亦庄龙玥城奢享影城 · 2025年", "era": "", "tags": []}, {"section": "社会素材", "category": "社会现象", "title": "电影+火锅（苏州）", "content": "餐饮消费正一步步“吃掉”影厅内部的注意力分配。", "source": "苏州三克映画仁恒仓街店 · 2023年12月", "era": "", "tags": []}, {"section": "社会素材", "category": "社会现象", "title": "电影+火锅（珠海）", "content": "影院内部的“感官秩序”被重新定义，气味与光影共存。", "source": "珠海中影灯塔影城横琴华发商都店 · 2025年", "era": "", "tags": []}, {"section": "社会素材", "category": "社会现象", "title": "Mirra奇镜派对融合厅", "content": "电影退居为众多“可播放内容”之一，影院变为娱乐综合体。", "source": "北京耀莱成龙影城五棵松店 · 2025年", "era": "", "tags": []}, {"section": "社会素材", "category": "社会现象", "title" const catMap = {
  "一、空间形态类型": 1,
  "二、建筑风格与美学": 2,
  "三、空间改造与适应性再利用": 3,
  "四、观影行为与空间实践": 4,
  "五、放映技术与影像形式": 5,
  "六、声学空间设计": 6,
  "七、策展与空间增值实践": 7,
  "八、空间理论与分析框架": 8,
};

const sectionClass = {
  "形式灵感": "sec-form",
  "社会素材": "sec-social",
  "文学": "sec-lit",
};

const wall = document.getElementById('cardWall');
const countLabel = document.getElementById('countLabel');
const subFilterBar = document.getElementById('subFilterBar');

let currentFilter = 'all';
let currentSubFilter = 'all';

function buildTags(tags) {
  if (!tags || tags.length === 0) return '';
  return tags.map(t => `<span class="tag">${t}</span>`).join('');
}

function getCategoriesInSection(section) {
  const cats = new Set();
  rawData.forEach(d => { if (d.section === section) cats.add(d.category); });
  return Array.from(cats);
}

function renderSubFilters(section) {
  subFilterBar.innerHTML = '';
  if (section === 'all' || section !== '形式灵感') {
    subFilterBar.classList.add('hidden');
    currentSubFilter = 'all';
    return;
  }
  subFilterBar.classList.remove('hidden');
  const allBtn = document.createElement('button');
  allBtn.className = 'sub-btn active';
  allBtn.textContent = '全部';
  allBtn.dataset.cat = 'all';
  allBtn.onclick = () => { currentSubFilter = 'all'; updateSubBtnState(); renderCards(); };
  subFilterBar.appendChild(allBtn);

  getCategoriesInSection(section).forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'sub-btn';
    btn.textContent = cat.replace(/^一、二、三、四、五、六、七、八、/, '');
    btn.dataset.cat = cat;
    btn.onclick = () => { currentSubFilter = cat; updateSubBtnState(); renderCards(); };
    subFilterBar.appendChild(btn);
  });
}

function updateSubBtnState() {
  subFilterBar.querySelectorAll('.sub-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.cat === currentSubFilter);
  });
}

function renderCards() {
  wall.innerHTML = '';
  let shown = 0;
  rawData.forEach((item, idx) => {
    if (currentFilter !== 'all' && item.section !== currentFilter) return;
    if (currentSubFilter !== 'all' && item.category !== currentSubFilter) return;
    shown++;

    const secCls = sectionClass[item.section] || 'sec-form';
    const eraText = item.era ? item.era : (item.source ? item.source.split('·').pop().trim() : '');
    const sourceShort = item.source.length > 40 ? item.source.slice(0, 40) + '…' : item.source;

    const wrap = document.createElement('div');
    wrap.className = `card-wrap ${secCls}`;
    wrap.dataset.section = item.section;
    wrap.dataset.cat = item.category;
    wrap.dataset.idx = idx;

    wrap.innerHTML = `
      <div class="card">
        <div class="card-face card-front">
          <div class="card-section-tag">${item.section}</div>
          <div class="card-flip-hint">↻</div>
          <div class="card-title">${item.title}</div>
          ${eraText ? `<div class="card-era">${eraText}</div>` : ''}
          ${item.source ? `<div class="card-source-front">${sourceShort}</div>` : ''}
          <div class="card-tags">${buildTags(item.tags)}</div>
        </div>
        <div class="card-face card-back">
          <div class="back-title">${item.title}</div>
          <div class="back-content">${item.content}</div>
          ${item.source ? `<div class="back-source">出处：${item.source}</div>` : ''}
        </div>
      </div>
    `;
    wall.appendChild(wrap);
  });
  countLabel.textContent = `共 ${shown} 张卡片 · 点击翻转 · 拖拽移动`;
  initDrag();
  initFlip();
}

function initFlip() {
  document.querySelectorAll('.card-wrap').forEach(wrap => {
    wrap.addEventListener('click', e => {
      if (wrap.classList.contains('was-dragged')) return;
      const card = wrap.querySelector('.card');
      card.classList.toggle('flipped');
    });
  });
}

function initDrag() {
  let dragged = null;
  let offsetX = 0, offsetY = 0;
  let startX = 0, startY = 0;
  let moved = false;

  document.querySelectorAll('.card-wrap').forEach(wrap => {
    wrap.addEventListener('mousedown', e => {
      dragged = wrap;
      moved = false;
      wrap.classList.remove('was-dragged');
      const rect = wrap.getBoundingClientRect();
      offsetX = e.clientX - rect.left;
      offsetY = e.clientY - rect.top;
      startX = e.clientX;
      startY = e.clientY;
      wrap.style.position = 'fixed';
      wrap.style.left = rect.left + 'px';
      wrap.style.top = rect.top + 'px';
      wrap.style.width = rect.width + 'px';
      wrap.style.height = rect.height + 'px';
      wrap.classList.add('dragging');
    });
  });

  document.addEventListener('mousemove', e => {
    if (!dragged) return;
    if (Math.abs(e.clientX - startX) > 3 || Math.abs(e.clientY - startY) > 3) moved = true;
    dragged.style.left = (e.clientX - offsetX) + 'px';
    dragged.style.top = (e.clientY - offsetY) + 'px';
  });

  document.addEventListener('mouseup', () => {
    if (!dragged) return;
    dragged.classList.remove('dragging');
    if (moved) {
      dragged.classList.add('was-dragged');
      setTimeout(() => dragged.classList.remove('was-dragged'), 300);
    } else {
      dragged.style.position = '';
      dragged.style.left = '';
      dragged.style.top = '';
      dragged.style.width = '';
      dragged.style.height = '';
    }
    dragged = null;
  });
}

// Main filter buttons
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderSubFilters(currentFilter);
    renderCards();
  });
});

renderCards();
</script>
